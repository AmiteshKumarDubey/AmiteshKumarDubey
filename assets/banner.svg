<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Amitesh Kumar Dubey, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .name { font: 700 54px 'Segoe UI', Ubuntu, Helvetica, Arial, sans-serif; fill: #ffffff; opacity: 0; animation: fade 1s ease 0.2s forwards; }
    .line { font: 500 24px 'Fira Code', Consolas, Menlo, monospace; fill: #61dafb; opacity: 0; }
    .l1 { animation: cyc 9s infinite 0s; }
    .l2 { animation: cyc 9s infinite 3s; }
    .l3 { animation: cyc 9s infinite 6s; }
    .deco { font: 700 90px Consolas, Menlo, monospace; fill: #ffffff; opacity: 0.06; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes cyc { 0% { opacity: 0; } 5% { opacity: 1; } 28% { opacity: 1; } 33%, 100% { opacity: 0; } }
  </style>
  <rect width="1200" height="240" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="16" fill="url(#grid)"/>
  <text class="deco" x="40" y="130">&lt;/&gt;</text>
  <text class="deco" x="1010" y="200">{ }</text>
  <text class="name" x="600" y="115" text-anchor="middle">Amitesh Kumar Dubey</text>
  <text class="line l1" x="600" y="170" text-anchor="middle">Full-Stack Developer | MERN &amp; AI</text>
  <text class="line l2" x="600" y="170" text-anchor="middle">Building Scalable Web Apps &amp; RAG Systems</text>
  <text class="line l3" x="600" y="170" text-anchor="middle">Open to Software Engineering Roles</text>
</svg>
